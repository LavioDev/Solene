<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <!-- Filter for cute sticker white outline + subtle drop shadow -->
  <defs>
    <filter id="stickerShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#000000" flood-opacity="0.12" />
    </filter>
  </defs>

  <g filter="url(#stickerShadow)">
    <!-- White Sticker Outline Layer -->
    <path d="M 50 85 C 40 55, 65 35, 75 55 C 90 40, 110 40, 125 55 C 135 35, 160 55, 150 85 C 170 120, 160 160, 135 170 C 120 178, 80 178, 65 170 C 40 160, 30 120, 50 85 Z" fill="#ffffff" stroke="#ffffff" stroke-width="12" stroke-linejoin="round" stroke-linecap="round" />

    <!-- Feet -->
    <ellipse cx="78" cy="168" rx="12" ry="8" fill="#ffffff" stroke="#333333" stroke-width="3.5" />
    <ellipse cx="122" cy="168" rx="12" ry="8" fill="#ffffff" stroke="#333333" stroke-width="3.5" />

    <!-- Left Ear Outer & Inner -->
    <path d="M 55 75 C 50 50, 72 45, 76 68 Z" fill="#ffffff" stroke="#333333" stroke-width="3.5" stroke-linejoin="round" />
    <path d="M 58 70 C 56 56, 70 54, 72 67 Z" fill="#ffe4ec" />

    <!-- Right Ear Outer & Inner -->
    <path d="M 145 75 C 150 50, 128 45, 124 68 Z" fill="#ffffff" stroke="#333333" stroke-width="3.5" stroke-linejoin="round" />
    <path d="M 142 70 C 144 56, 130 54, 128 67 Z" fill="#ffe4ec" />

    <!-- Main Body / Head -->
    <path d="M 52 90 C 42 125, 48 160, 80 168 C 120 175, 152 165, 148 125 C 158 90, 135 60, 100 60 C 65 60, 48 70, 52 90 Z" fill="#ffffff" stroke="#333333" stroke-width="3.5" stroke-linejoin="round" />

    <!-- Eyes (Big sparkling Chiikawa eyes) -->
    <ellipse cx="78" cy="105" rx="7.5" ry="9" fill="#2d2d2d" />
    <circle cx="76" cy="102" r="3.2" fill="#ffffff" />
    <circle cx="81" cy="108" r="1.5" fill="#ffffff" />

    <ellipse cx="122" cy="105" rx="7.5" ry="9" fill="#2d2d2d" />
    <circle cx="120" cy="102" r="3.2" fill="#ffffff" />
    <circle cx="125" cy="108" r="1.5" fill="#ffffff" />

    <!-- Eyebrows (Tiny curved lines) -->
    <path d="M 72 92 Q 78 89 84 93" fill="none" stroke="#333333" stroke-width="2.5" stroke-linecap="round" />
    <path d="M 116 93 Q 122 89 128 92" fill="none" stroke="#333333" stroke-width="2.5" stroke-linecap="round" />

    <!-- Nose & Mouth (Happy open mouth) -->
    <path d="M 97 114 Q 100 112 103 114" fill="none" stroke="#333333" stroke-width="2.5" stroke-linecap="round" />
    <path d="M 94 120 Q 100 128 106 120 Z" fill="#ff708f" stroke="#333333" stroke-width="2.5" stroke-linejoin="round" />

    <!-- Cheeks (Blushing pink) -->
    <ellipse cx="66" cy="116" rx="9" ry="6" fill="#ffb4c8" opacity="0.85" />
    <ellipse cx="134" cy="116" rx="9" ry="6" fill="#ffb4c8" opacity="0.85" />
    <!-- Cheek lines -->
    <line x1="63" y1="115" x2="69" y2="115" stroke="#ff4d79" stroke-width="1.5" stroke-linecap="round" />
    <line x1="131" y1="115" x2="137" y2="115" stroke="#ff4d79" stroke-width="1.5" stroke-linecap="round" />

    <!-- Hands (Waving cute paws) -->
    <ellipse cx="44" cy="120" rx="9" ry="7" fill="#ffffff" stroke="#333333" stroke-width="3" transform="rotate(-25 44 120)" />
    <ellipse cx="152" cy="126" rx="8" ry="7" fill="#ffffff" stroke="#333333" stroke-width="3" />

    <!-- Sparkles -->
    <path d="M 32 75 Q 35 70 35 65 Q 35 70 38 75 Q 35 75 35 80 Q 35 75 32 75 Z" fill="#ffd13b" />
    <path d="M 165 80 Q 168 76 168 72 Q 168 76 172 80 Q 168 80 168 84 Q 168 80 165 80 Z" fill="#ffd13b" />
  </g>
</svg>
