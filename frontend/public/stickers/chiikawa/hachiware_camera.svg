<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <filter id="stickerShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#000000" flood-opacity="0.12" />
    </filter>
  </defs>

  <g filter="url(#stickerShadow)">
    <!-- White Sticker Outline Layer -->
    <path d="M 45 75 C 35 45, 60 25, 75 48 C 90 35, 110 35, 125 48 C 140 25, 165 45, 155 75 C 172 110, 165 155, 135 168 C 120 178, 80 178, 65 168 C 35 155, 28 110, 45 75 Z" fill="#ffffff" stroke="#ffffff" stroke-width="12" stroke-linejoin="round" stroke-linecap="round" />

    <!-- Feet -->
    <ellipse cx="78" cy="168" rx="12" ry="8" fill="#ffffff" stroke="#333333" stroke-width="3.5" />
    <ellipse cx="122" cy="168" rx="12" ry="8" fill="#ffffff" stroke="#333333" stroke-width="3.5" />

    <!-- Ears -->
    <path d="M 52 70 C 44 40, 68 30, 78 55 Z" fill="#58a0df" stroke="#333333" stroke-width="3.5" stroke-linejoin="round" />
    <path d="M 56 65 C 52 46, 68 40, 73 55 Z" fill="#ffe4ec" />

    <path d="M 148 70 C 156 40, 132 30, 122 55 Z" fill="#58a0df" stroke="#333333" stroke-width="3.5" stroke-linejoin="round" />
    <path d="M 144 65 C 148 46, 132 40, 127 55 Z" fill="#ffe4ec" />

    <!-- Main Head / Body -->
    <path d="M 50 85 C 40 120, 45 158, 80 168 C 120 175, 155 165, 150 120 C 160 85, 138 52, 100 52 C 62 52, 45 65, 50 85 Z" fill="#ffffff" stroke="#333333" stroke-width="3.5" stroke-linejoin="round" />

    <!-- Blue Hair Patch -->
    <path d="M 50 85 C 48 70, 65 52, 100 52 C 135 52, 152 70, 150 85 C 144 95, 125 80, 100 96 C 75 80, 56 95, 50 85 Z" fill="#58a0df" stroke="#333333" stroke-width="3" stroke-linejoin="round" />

    <!-- Eyes (Focused, sparkling with joy) -->
    <ellipse cx="78" cy="107" rx="7.5" ry="9" fill="#2d2d2d" />
    <circle cx="76" cy="104" r="3.2" fill="#ffffff" />
    <circle cx="81" cy="110" r="1.5" fill="#ffffff" />

    <ellipse cx="122" cy="107" rx="7.5" ry="9" fill="#2d2d2d" />
    <circle cx="120" cy="104" r="3.2" fill="#ffffff" />
    <circle cx="125" cy="110" r="1.5" fill="#ffffff" />

    <!-- Nose & Mouth (:3 smile) -->
    <path d="M 97 114 Q 100 112 103 114" fill="none" stroke="#333333" stroke-width="2.5" stroke-linecap="round" />
    <path d="M 93 118 Q 96 123 100 119 Q 104 123 107 118" fill="none" stroke="#333333" stroke-width="2.5" stroke-linecap="round" />

    <!-- Cheeks -->
    <ellipse cx="64" cy="117" rx="8" ry="5" fill="#ffb4c8" opacity="0.85" />
    <ellipse cx="136" cy="117" rx="8" ry="5" fill="#ffb4c8" opacity="0.85" />

    <!-- Retro Blue Camera held proudly in paws -->
    <rect x="74" y="132" width="52" height="34" rx="7" fill="#40b8a0" stroke="#333333" stroke-width="3" stroke-linejoin="round" />
    <rect x="80" y="128" width="14" height="5" rx="2" fill="#333333" />
    <circle cx="100" cy="149" r="11" fill="#2d2d2d" stroke="#ffffff" stroke-width="2" />
    <circle cx="100" cy="149" r="6" fill="#6bd2ff" />
    <circle cx="98" cy="147" r="2" fill="#ffffff" />
    <!-- Flash indicator -->
    <circle cx="118" cy="139" r="3" fill="#ffe066" stroke="#333333" stroke-width="1.5" />

    <!-- Paws holding camera -->
    <ellipse cx="71" cy="148" rx="7" ry="6" fill="#ffffff" stroke="#333333" stroke-width="2.8" />
    <ellipse cx="129" cy="148" rx="7" ry="6" fill="#ffffff" stroke="#333333" stroke-width="2.8" />

    <!-- Camera flash sparkles -->
    <polygon points="152,118 156,112 162,116 158,122" fill="#ffd13b" />
    <path d="M 165 130 Q 169 125 174 130 Q 169 135 165 130 Z" fill="#ffd13b" />
  </g>
</svg>
