<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <filter id="stickerShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#000000" flood-opacity="0.12" />
    </filter>
  </defs>

  <g filter="url(#stickerShadow)">
    <!-- White Sticker Outline Layer -->
    <path d="M 45 90 C 35 60, 60 40, 72 60 C 88 45, 112 45, 128 60 C 140 40, 165 60, 155 90 C 175 125, 165 165, 140 175 C 120 182, 80 182, 60 175 C 35 165, 25 125, 45 90 Z" fill="#ffffff" stroke="#ffffff" stroke-width="12" stroke-linejoin="round" stroke-linecap="round" />

    <!-- Left Ear Outer & Inner -->
    <path d="M 55 75 C 50 50, 72 45, 76 68 Z" fill="#ffffff" stroke="#333333" stroke-width="3.5" stroke-linejoin="round" />
    <path d="M 58 70 C 56 56, 70 54, 72 67 Z" fill="#ffe4ec" />

    <!-- Right Ear Outer & Inner -->
    <path d="M 145 75 C 150 50, 128 45, 124 68 Z" fill="#ffffff" stroke="#333333" stroke-width="3.5" stroke-linejoin="round" />
    <path d="M 142 70 C 144 56, 130 54, 128 67 Z" fill="#ffe4ec" />

    <!-- Main Body / Head -->
    <path d="M 52 95 C 42 130, 48 165, 80 172 C 120 178, 152 170, 148 130 C 158 95, 135 65, 100 65 C 65 65, 48 75, 52 95 Z" fill="#ffffff" stroke="#333333" stroke-width="3.5" stroke-linejoin="round" />

    <!-- Sleeping Eyes (Curved happy lines ^_^) -->
    <path d="M 70 108 Q 78 116 86 108" fill="none" stroke="#333333" stroke-width="3.5" stroke-linecap="round" />
    <path d="M 114 108 Q 122 116 130 108" fill="none" stroke="#333333" stroke-width="3.5" stroke-linecap="round" />

    <!-- Soft peaceful mouth -->
    <path d="M 97 122 Q 100 124 103 122" fill="none" stroke="#333333" stroke-width="2.5" stroke-linecap="round" />

    <!-- Cheeks (Blushing pink) -->
    <ellipse cx="66" cy="116" rx="9" ry="6" fill="#ffb4c8" opacity="0.85" />
    <ellipse cx="134" cy="116" rx="9" ry="6" fill="#ffb4c8" opacity="0.85" />

    <!-- Snot sleep bubble (Cute anime style) -->
    <circle cx="106" cy="118" r="9" fill="#9de1fe" stroke="#48a6d6" stroke-width="2" opacity="0.85" />
    <circle cx="104" cy="115" r="2.5" fill="#ffffff" opacity="0.9" />

    <!-- Zzz Floating Letters -->
    <text x="145" y="65" font-family="sans-serif" font-weight="bold" font-size="20" fill="#75bbf0" stroke="#ffffff" stroke-width="2" paint-order="stroke fill">Z</text>
    <text x="160" y="45" font-family="sans-serif" font-weight="bold" font-size="16" fill="#99d1fa" stroke="#ffffff" stroke-width="2" paint-order="stroke fill">z</text>
    <text x="172" y="30" font-family="sans-serif" font-weight="bold" font-size="12" fill="#bae2fd" stroke="#ffffff" stroke-width="2" paint-order="stroke fill">z</text>

    <!-- Little resting paws -->
    <ellipse cx="82" cy="146" rx="9" ry="6" fill="#ffffff" stroke="#333333" stroke-width="3" />
    <ellipse cx="118" cy="146" rx="9" ry="6" fill="#ffffff" stroke="#333333" stroke-width="3" />
  </g>
</svg>
