services:
  postgres:
    image: postgres:16-alpine
    container_name: solene-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: solene
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: riojen2005
    ports:
      - "5432:5432"
    volumes:
      - solene_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: solene-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - solene_redis_data:/data

  emqx:
    image: emqx/emqx:5.8.0
    container_name: solene-emqx
    restart: unless-stopped
    ports:
      - "1883:1883"
      - "18083:18083"

volumes:
  solene_postgres_data:
  solene_redis_data:
