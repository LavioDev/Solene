services:
  postgres:
    image: postgres:16-alpine
    container_name: solene-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: solene
      POSTGRES_USER: solene
      POSTGRES_PASSWORD: riojen2005
    ports:
      - "5433:5432"
    volumes:
      - solene_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: solene-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - solene_redis_data:/data

  emqx:
    image: emqx/emqx:5.8.0
    container_name: solene-emqx
    restart: unless-stopped
    ports:
      - "1883:1883"
      - "18083:18083"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: solene-backend
    restart: unless-stopped
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_DATABASE=solene
      - DB_USERNAME=solene
      - DB_PASSWORD=riojen2005
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - MQTT_BROKER_HOST=emqx
      - MQTT_BROKER_PORT=1883
    ports:
      - "8200:8200"
    depends_on:
      - postgres
      - redis
      - emqx
    volumes:
      - ./backend/uploads:/app/uploads

volumes:
  solene_postgres_data:
  solene_redis_data:
